anslateY(0);opacity:0}50%{opacity:.25}}.badge-text,.subtitle-text,.title-text{font-family:-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif}.title-text{font-weight:800;font-size:42px;letter-spacing:-.5px}.subtitle-text{font-weight:500;font-size:20px;fill:#94a3b8}.badge-text{font-weight:600;font-size:13px;fill:#e2e8f0}.code-font{font-family:&apos;Fira Code&apos;,&apos;Courier New&apos;,Courier,monospace;font-size:12px;fill:#38bdf8}.floating-orb-1{animation:floatSlow1 10s ease-in-out infinite}.floating-orb-2{animation:floatSlow2 12s ease-in-out infinite}.beam-animated{stroke-dasharray:20 15;animation:pulseBeam 4s linear infinite}.scanner-beam{animation:scanline 8s linear infinite}</style></defs><rect width="1200" height="420" fill="url(#bgGradient)" rx="16"/><rect width="1200" height="420" fill="url(#gridPattern)" rx="16"/><g id="dynamic-ambient-background"><circle cx="220" cy="140" r="140" fill="#6366f1" class="floating-orb-1" filter="url(#glow)" opacity=".18"/><circle cx="980" cy="240" r="160" fill="#a855f7" class="floating-orb-2" filter="url(#glow)" opacity=".16"/><circle cx="1080" cy="90" r="100" fill="#06b6d4" class="floating-orb-1" filter="url(#glow)" opacity=".15"/><path fill="none" stroke="#38bdf8" stroke-width="1.5" d="M 50 80 Q 300 20 600 80 T 1150 90" class="beam-animated" opacity=".4"/><path fill="none" stroke="#c084fc" stroke-width="1.5" d="M 80 340 Q 400 390 750 320 T 1120 350" class="beam-animated" opacity=".35"/><line x1="0" x2="1200" y1="0" y2="0" stroke="#818cf8" stroke-width="1.5" class="scanner-beam"/><g opacity=".25" transform="translate(1000, 60)"><circle cx="60" cy="60" r="30" fill="none" stroke="#60a5fa" stroke-width="1.5"/><circle cx="60" cy="60" r="8" fill="#a855f7"/><path stroke="#38bdf8" stroke-width="1.5" d="M 60 90 L 60 130 M 40 130 L 80 130"/><circle cx="35" cy="145" r="12" fill="none" stroke="#c084fc" stroke-width="1.5"/><circle cx="85" cy="145" r="12" fill="none" stroke="#38bdf8" stroke-width="1.5"