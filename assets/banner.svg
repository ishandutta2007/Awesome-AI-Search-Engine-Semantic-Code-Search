<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0c16" />
      <stop offset="50%" stop-color="#0e1326" />
      <stop offset="100%" stop-color="#05070e" />
    </linearGradient>

    <!-- Glowing Text Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <!-- Accent Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.8" />
    </linearGradient>

    <!-- Pill Gradient -->
    <linearGradient id="pillGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#31104b" stop-opacity="0.8" />
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#38bdf8" stroke-width="0.75" stroke-opacity="0.07" />
      <circle cx="40" cy="40" r="1.5" fill="#818cf8" fill-opacity="0.15" />
    </pattern>

    <style>
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        font-size: 42px;
        letter-spacing: -0.5px;
      }
      .subtitle-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 500;
        font-size: 20px;
        fill: #94a3b8;
      }
      .badge-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 13px;
        fill: #e2e8f0;
      }
      .code-font {
        font-family: 'Fira Code', 'Courier New', Courier, monospace;
        font-size: 12px;
        fill: #38bdf8;
      }

      /* Dynamic Ambient Animations */
      @keyframes floatSlow1 {
        0% { transform: translate(0px, 0px) scale(1); }
        50% { transform: translate(30px, -20px) scale(1.08); }
        100% { transform: translate(0px, 0px) scale(1); }
      }
      @keyframes floatSlow2 {
        0% { transform: translate(0px, 0px) scale(1); }
        50% { transform: translate(-25px, 25px) scale(1.1); }
        100% { transform: translate(0px, 0px) scale(1); }
      }
      @keyframes pulseBeam {
        0% { opacity: 0.2; stroke-dashoffset: 200; }
        50% { opacity: 0.7; }
        100% { opacity: 0.2; stroke-dashoffset: 0; }
      }
      @keyframes orbitParticle {
        0% { transform: rotate(0deg) translateX(70px) rotate(0deg); }
        100% { transform: rotate(360deg) translateX(70px) rotate(-360deg); }
      }
      @keyframes scanline {
        0% { transform: translateY(0); opacity: 0; }
        50% { opacity: 0.25; }
        100% { transform: translateY(420px); opacity: 0; }
      }

      .floating-orb-1 {
        animation: floatSlow1 10s ease-in-out infinite;
      }
      .floating-orb-2 {
        animation: floatSlow2 12s ease-in-out infinite;
      }
      .beam-animated {
        stroke-dasharray: 20 15;
        animation: pulseBeam 4s linear infinite;
      }
      .scanner-beam {
        animation: scanline 8s linear infinite;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGradient)" />
  <rect width="1200" height="420" rx="16" fill="url(#gridPattern)" />

  <!-- DYNAMIC BACKGROUND LAYER (Ambient glowing orbs & neural network beams) -->
  <g id="dynamic-ambient-background">
    <!-- Glowing Orb Left/Center -->
    <circle class="floating-orb-1" cx="220" cy="140" r="140" fill="#6366f1" opacity="0.18" filter="url(#glow)" />
    <!-- Glowing Orb Right -->
    <circle class="floating-orb-2" cx="980" cy="240" r="160" fill="#a855f7" opacity="0.16" filter="url(#glow)" />
    <!-- Glowing Orb Top Right -->
    <circle class="floating-orb-1" cx="1080" cy="90" r="100" fill="#06b6d4" opacity="0.15" filter="url(#glow)" />

    <!-- Animated Search / AST Flow Line Beams in Background -->
    <path class="beam-animated" d="M 50 80 Q 300 20 600 80 T 1150 90" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.4" />
    <path class="beam-animated" d="M 80 340 Q 400 390 750 320 T 1120 350" fill="none" stroke="#c084fc" stroke-width="1.5" opacity="0.35" />

    <!-- Subtle Scanline -->
    <line class="scanner-beam" x1="0" y1="0" x2="1200" y2="0" stroke="#818cf8" stroke-width="1.5" />

    <!-- Abstract AST Node Icons in Far Background -->
    <g opacity="0.25" transform="translate(1000, 60)">
      <circle cx="60" cy="60" r="30" fill="none" stroke="#60a5fa" stroke-width="1.5" />
      <circle cx="60" cy="60" r="8" fill="#a855f7" />
      <path d="M 60 90 L 60 130 M 40 130 L 80 130" stroke="#38bdf8" stroke-width="1.5" />
      <circle cx="35" cy="145" r="12" fill="none" stroke="#c084fc" stroke-width="1.5" />
      <circle cx="85" cy="145" r="12" fill="none" stroke="#38bdf8" stroke-width="1.5" />
    </g>
  </g>

  <!-- BORDER FRAME -->
  <rect x="1.5" y="1.5" width="1197" height="417" rx="15" fill="none" stroke="url(#borderGrad)" stroke-width="1.5" />

  <!-- FOREGROUND LAYER (Guaranteed clear, crisp, and high contrast) -->
  <g id="foreground-content" transform="translate(80, 0)">
    
    <!-- Category Pill Tag -->
    <g transform="translate(0, 52)">
      <rect width="320" height="32" rx="16" fill="url(#pillGrad)" stroke="#6366f1" stroke-width="1" />
      <circle cx="16" cy="16" r="5" fill="#10b981">
        <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite" />
      </circle>
      <text x="32" y="21" class="badge-text" fill="#38bdf8">⚡ CURATED ECOSYSTEM &amp; RADAR 2026</text>
    </g>

    <!-- Main Title (Gradient Fill + Soft Glow) -->
    <g transform="translate(0, 134)">
      <text class="title-text" fill="url(#textGrad)" filter="url(#softGlow)">
        Awesome AI Search Engine &amp;
      </text>
      <text class="title-text" y="52" fill="url(#textGrad)">
        Semantic Code Search
      </text>
    </g>

    <!-- Subtitle -->
    <g transform="translate(0, 232)">
      <text class="subtitle-text">
        Citation-Backed Web Search • AST/LSP Code Intelligence • Agentic Search RAG
      </text>
    </g>

    <!-- Feature Pills / Highlights (Foreground Badges) -->
    <g transform="translate(0, 280)">
      <!-- Pill 1 -->
      <g transform="translate(0, 0)">
        <rect width="180" height="38" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <circle cx="20" cy="19" r="6" fill="#38bdf8" />
        <text x="36" y="24" class="badge-text">🔍 Deep Web Research</text>
      </g>

      <!-- Pill 2 -->
      <g transform="translate(195, 0)">
        <rect width="190" height="38" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <circle cx="20" cy="19" r="6" fill="#818cf8" />
        <text x="36" y="24" class="badge-text">🌲 Tree-sitter &amp; AST/LSP</text>
      </g>

      <!-- Pill 3 -->
      <g transform="translate(400, 0)">
        <rect width="180" height="38" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <circle cx="20" cy="19" r="6" fill="#ec4899" />
        <text x="36" y="24" class="badge-text">⚡ Enterprise Code RAG</text>
      </g>

      <!-- Pill 4 -->
      <g transform="translate(595, 0)">
        <rect width="185" height="38" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <circle cx="20" cy="19" r="6" fill="#10b981" />
        <text x="36" y="24" class="badge-text">🛡️ Self-Hosted Sovereignty</text>
      </g>
    </g>

    <!-- Bottom Metric Bar -->
    <g transform="translate(0, 355)">
      <text class="code-font">INDEXING: PERPLEXITY • CURSOR • EXA • GLEAN • FIRECRAWL • SEARXNG • COCOINDEX • SERENA • RIPGREP</text>
    </g>
  </g>
</svg>
